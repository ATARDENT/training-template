version: "1.0.0"

# ── Dataset ────────────────────────────────────────────────────────────────
dataset:
  repo_id: "my-org/my-compiled-dataset"   # Storage location of the compiled dataset
  revision: "main"                         # Branch or tag to pull

# ── Data split ────────────────────────────────────────────────────────────
split:
  train: 0.8                               # Must sum to 1.0
  val:   0.1
  test:  0.1

# ── Training ──────────────────────────────────────────────────────────────
training:
  max_epochs: 10                           # Hard stop; set null to use max_steps instead
  max_steps: null                          # Alternative to max_epochs
  save_mode: checkpoint                    # checkpoint | lora
  run_test_after: true                     # Set false to skip Steps 9–10

# ── Compute ───────────────────────────────────────────────────────────────
# Backends are tried in priority order until one is available.
compute:
  priority:
    - colab
    - vastai
    - aws
    - gcp

  colab:
    # No config needed; uses the active Colab runtime.
    # Triggered via Drive sentinel file — see ResearchFacade docs.
    status_folder: "/tmp/colab_sessions"

  vastai:
    gpu_name: RTX_3090
    num_gpus: 1
    min_ram: 16                            # GB
    image: "pytorch/pytorch:2.2.0-cuda12.1-cudnn8-devel"
    disk: 30                               # GB
    max_dph: 0.40                          # Maximum dollars per hour

  aws:
    instance_type: g4dn.xlarge
    region: us-east-1
    spot: true

  gcp:
    machine_type: n1-standard-8
    accelerator: nvidia-tesla-t4
    accelerator_count: 1
    zone: us-central1-a
    spot: true                             # Preemptible instance

# ── Output ────────────────────────────────────────────────────────────────
output:
  name: "my-model"                         # Base name for the stored artefact
  destination: github                      # github | gdrive
  branch: models                           # Target branch (if destination: github)
  folder_id: ""                            # Google Drive folder ID (if destination: gdrive)

# ── Version tagging ───────────────────────────────────────────────────────
tag:
  enabled: true
  prefix: "model"                          # Tag format: <prefix>-v<version>
                                           # e.g. model-v1.0.0